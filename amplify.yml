version: 1
backend:
  phases:
    prebuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx cdx bootstrap aws://084375546337/us-east-1 || echo echo "Bootstrap already exists or failed - continuing"
    build:
      commands:
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
